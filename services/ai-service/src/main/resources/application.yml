server:
  port: ${AI_SERVICE_PORT:8086}

spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${MSSQL_PORT:1433};databaseName=investflow_investment;encrypt=true;trustServerCertificate=true
    username: ${DB_USER:investflow_app}
    password: ${DB_PASSWORD:InvestFlowApp#2026!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:InvestFlowRedis@2026!}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

ai:
  llm:
    provider: ${LLM_PROVIDER:mock}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gemini-2.5-flash}
    query-timeout-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [CID:%X{correlationId}] - %msg%n"
  level:
    root: INFO
    com.investflow: DEBUG
